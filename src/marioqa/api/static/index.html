<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mario Odyssey RAG</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e1db;
    --accent: #d62718; --accent-ink: #ffffff; --ok: #1f7a4d; --warn-bg: #fff4d6; --warn: #8a5a00;
    --abst-bg: #fde8e6; --abst: #a3231a; --code: #f0eee9; --chip: #efede8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1d1d20; --ink: #ececef; --muted: #9a9aa2; --line: #2e2e33;
      --accent: #ff5a4a; --accent-ink: #141416; --ok: #5fd39a; --warn-bg: #3a2f12; --warn: #f2c86b;
      --abst-bg: #3a1c1a; --abst: #ff9c92; --code: #26262a; --chip: #26262a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
           padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; }
  header h1 span { color: var(--accent); }
  .role { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center;
          flex-wrap: wrap; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px;
           background: var(--chip); color: var(--ink); }
  .badge.admin { background: var(--accent); color: var(--accent-ink); }
  main { max-width: 900px; margin: 0 auto; padding: 18px 16px 48px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 16px; margin-bottom: 14px; }
  textarea { width: 100%; min-height: 72px; resize: vertical; padding: 10px 12px; font: inherit;
             color: var(--ink); background: var(--bg); border: 1px solid var(--line);
             border-radius: 8px; }
  .row { display: flex; gap: 10px; align-items: center; justify-content: space-between;
         margin-top: 8px; flex-wrap: wrap; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer;
           background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line);
                 font-weight: 400; padding: 4px 10px; font-size: 13px; }
  button:disabled { opacity: .55; cursor: progress; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { background: var(--chip); color: var(--ink); border: 0; font-weight: 400;
          font-size: 13px; padding: 4px 10px; border-radius: 999px; }
  .counter { color: var(--muted); font-size: 12px; }
  .banner { border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-size: 14px; }
  .banner.abst { background: var(--abst-bg); color: var(--abst); }
  .banner.review { background: var(--warn-bg); color: var(--warn); }
  .answer { white-space: pre-wrap; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 8px; }
  h2 { font-size: 14px; margin: 14px 0 6px; color: var(--muted); font-weight: 600;
       text-transform: uppercase; letter-spacing: .04em; }
  ol.sources { margin: 0; padding-left: 20px; }
  ol.sources li { margin: 2px 0; }
  code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line);
           white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0;
       font-size: 13px; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .err { color: var(--abst); }
  .hidden { display: none; }
  input[type=password] { font: inherit; padding: 4px 8px; border: 1px solid var(--line);
                         border-radius: 6px; background: var(--bg); color: var(--ink);
                         width: 140px; }
  pre { background: var(--code); padding: 8px; border-radius: 6px; overflow-x: auto;
        font-size: 12px; max-height: 360px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 0 16px 24px; }
</style>
</head>
<body>
<header>
  <h1><span>●</span> Mario Odyssey RAG</h1>
  <div class="role">
    Rol: <span id="role" class="badge">jugador</span>
    <form id="login" class="role">
      <input id="token" type="password" placeholder="token admin" autocomplete="off">
      <button class="ghost" type="submit">Entrar</button>
    </form>
    <button id="logout" class="ghost hidden" type="button">Salir</button>
  </div>
</header>

<main>
  <section class="card">
    <form id="ask">
      <textarea id="q" maxlength="300" placeholder="Pregunta sobre Super Mario Odyssey…"
                required></textarea>
      <div class="row">
        <span class="counter"><span id="count">0</span>/300</span>
        <span id="version-box" class="hidden counter">
          versión <input id="version" type="text" placeholder="activa" size="10">
        </span>
        <button id="send" type="submit">Preguntar</button>
      </div>
    </form>
    <div class="chips" id="chips"></div>
  </section>

  <section id="result" class="card hidden" aria-live="polite">
    <div id="banners"></div>
    <div id="answer" class="answer"></div>
    <div id="meta" class="meta"></div>
    <h2>Fuentes</h2>
    <ol id="sources" class="sources"></ol>
    <details id="trace-box">
      <summary>Trazabilidad</summary>
      <dl id="trace"></dl>
      <h2>Herramientas</h2>
      <div class="scroll"><table id="tools"></table></div>
      <h2>Candidatos (top-10 tras fusión y rerank)</h2>
      <div class="scroll"><table id="cands"></table></div>
    </details>
  </section>

  <section id="audit-card" class="card hidden">
    <div class="row" style="margin-top:0">
      <strong>Auditoría (solo admin)</strong>
      <button id="audit-btn" class="ghost" type="button">Cargar últimas 10</button>
    </div>
    <pre id="audit" class="hidden"></pre>
  </section>
</main>
<footer>
  Contenido de la <a href="https://www.mariowiki.com" target="_blank" rel="noopener">Super Mario
  Wiki</a> bajo CC BY-SA. Proyecto académico sin afiliación con Nintendo.
</footer>

<script>
const $ = (id) => document.getElementById(id);
const DEMOS = [
  "¿Cómo consigo la Power Moon que está detrás de la cascada?",
  "¿Dónde puedo comprar el atuendo de samurái?",
  "Estoy atascado en el Reino de las Arenas, ¿cómo continúo?",
  "¿Qué necesito para desbloquear determinada zona?",
  "¿Cuántas lunas hay en el Reino de las Arenas?",
];
let role = "jugador";

function el(tag, text, cls) {
  const n = document.createElement(tag);
  if (text !== undefined && text !== null) n.textContent = String(text);
  if (cls) n.className = cls;
  return n;
}
function fmt(x) { return typeof x === "number" ? x.toFixed(3) : (x ?? "—"); }

function setRole(r) {
  role = r;
  $("role").textContent = r;
  $("role").className = "badge" + (r === "admin" ? " admin" : "");
  $("login").classList.toggle("hidden", r === "admin");
  $("logout").classList.toggle("hidden", r !== "admin");
  $("audit-card").classList.toggle("hidden", r !== "admin");
  $("version-box").classList.toggle("hidden", r !== "admin");
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail ? JSON.stringify(body.detail) : res.statusText);
  return body;
}

function renderTable(table, headers, rows) {
  table.replaceChildren();
  const tr = el("tr");
  headers.forEach(([h, num]) => tr.appendChild(el("th", h, num ? "num" : "")));
  table.appendChild(tr);
  rows.forEach((r) => {
    const row = el("tr");
    r.forEach((v, i) => row.appendChild(el("td", v, headers[i][1] ? "num" : "")));
    table.appendChild(row);
  });
}

function render(data) {
  const o = data.output, t = data.trace;
  $("result").classList.remove("hidden");
  const banners = $("banners");
  banners.replaceChildren();
  if (o.abstained) banners.appendChild(el("div",
    "El sistema se abstuvo: no hay evidencia suficiente o la consulta no se puede atender.",
    "banner abst"));
  if (o.needs_human_review) banners.appendChild(el("div",
    "Requiere revisión humana (ambigüedad, soporte parcial o falla de un servicio).",
    "banner review"));
  $("answer").textContent = o.answer;
  $("meta").textContent =
    `herramienta: ${o.tool_used ?? "ninguna"} · ${data.latency_s.toFixed(2)} s · ` +
    `${data.tokens.input}+${data.tokens.output} tokens · $${data.cost_usd.toFixed(5)}`;

  const src = $("sources");
  src.replaceChildren();
  if (!o.sources.length) src.appendChild(el("li", "Sin fuentes."));
  o.sources.forEach((s) => {
    const li = el("li");
    const a = el("a", `${s.source} › ${s.page}`);
    if (/^https:\/\//.test(s.url)) { a.href = s.url; a.target = "_blank"; a.rel = "noopener"; }
    li.append(a, " ", el("code", s.chunk_id));
    src.appendChild(li);
  });

  const dl = $("trace");
  dl.replaceChildren();
  const ents = (t.entities || []).map((e) => `${e.canonical} (${e.type})`).join(", ");
  [
    ["request_id", data.request_id],
    ["rol (sesión)", data.role],
    ["intención", t.intent ?? (t.input && !t.input.ok ? "rechazada en entrada" : "—")],
    ["motivo", (t.route_reasons || []).join("; ") || (t.input && t.input.reason) || "—"],
    ["entidades", ents || "—"],
    ["consulta expandida", t.expanded_query ?? "—"],
    ["filtros", JSON.stringify(t.filters)],
    ["compuerta τ", `máx ${fmt(t.max_score)} vs τ ${t.tau} → ${t.gate_passed ?? "—"}`],
    ["denegados (2.ª validación)", (t.denied || []).length],
    ["incidencias", [...(t.issues || []), ...(t.errors || [])].join("; ") || "ninguna"],
  ].forEach(([k, v]) => { dl.append(el("dt", k), el("dd", v)); });

  renderTable($("tools"), [["herramienta"], ["ok"], ["parámetros"], ["s", true]],
    (t.tool_calls || []).map((c) => [c.tool, c.ok ? "sí" : `no: ${c.error}`,
      JSON.stringify(c.params), fmt(c.latency_s)]));
  renderTable($("cands"),
    [["fuente › sección"], ["denso", true], ["BM25", true], ["fusión", true], ["rerank", true]],
    (t.candidates || []).map((c) => [`${c.source} › ${c.page}`, fmt(c.dense), fmt(c.lexical),
      fmt(c.fused), fmt(c.rerank)]));
}

$("q").addEventListener("input", () => { $("count").textContent = $("q").value.length; });
DEMOS.forEach((d) => {
  const b = el("button", d, "chip");
  b.type = "button";
  b.onclick = () => { $("q").value = d; $("count").textContent = d.length; $("ask").requestSubmit(); };
  $("chips").appendChild(b);
});

$("ask").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const question = $("q").value.trim();
  if (!question) return;
  $("send").disabled = true; $("send").textContent = "Buscando…";
  try {
    const body = { question };
    const v = $("version").value.trim();
    if (role === "admin" && v) body.version = v;
    render(await api("/ask", { method: "POST", body: JSON.stringify(body) }));
  } catch (e) {
    $("result").classList.remove("hidden");
    $("banners").replaceChildren(el("div", `Error: ${e.message}`, "banner abst"));
    $("answer").textContent = ""; $("sources").replaceChildren(); $("meta").textContent = "";
  } finally {
    $("send").disabled = false; $("send").textContent = "Preguntar";
  }
});

$("login").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  try {
    const r = await api("/login", { method: "POST",
      body: JSON.stringify({ token: $("token").value }) });
    $("token").value = ""; setRole(r.role);
  } catch (e) { alert("Token inválido"); }
});
$("logout").onclick = async () => { setRole((await api("/logout", { method: "POST" })).role); };
$("audit-btn").onclick = async () => {
  try {
    $("audit").textContent = JSON.stringify(await api("/audit?limit=10"), null, 1);
  } catch (e) { $("audit").textContent = `Error: ${e.message}`; }
  $("audit").classList.remove("hidden");
};

api("/session").then((s) => setRole(s.role)).catch(() => setRole("jugador"));
</script>
</body>
</html>
